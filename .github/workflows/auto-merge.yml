name: Auto-merge

# Merges a low-risk PR once every check on its head commit has passed, and
# leaves the rest for the owner. workflow_run always runs this file and
# scripts/auto_merge.py from main, so a PR can't change the rules that judge
# it. Nothing here checks out or runs the PR's code; the script reads the PR
# through the GitHub API as data. The rules are in
# kb/decisions/0002-ci-decides-what-merges.md.

on:
  workflow_run:
    # Keep in step with REQUIRED_WORKFLOWS in scripts/auto_merge.py.
    workflows: [Board tests, Bot chart, KB lint, Scripts tests, Secret scan]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the PR to check again
        required: true

permissions: {}

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || inputs.pr }}
  cancel-in-progress: false

jobs:
  merge:
    # Checks on pushes, on main and from manual runs never merge anything,
    # and a failed check can't, so those runs skip the job and use no minutes.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge the PR if it is low risk and every check passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ inputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            python3 scripts/auto_merge.py --repo "$REPO" --pr "$PR"
          else
            python3 scripts/auto_merge.py --repo "$REPO" --sha "$SHA"
          fi
