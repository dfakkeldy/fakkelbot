name: Bot chart

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Read every bot file
        run: python3 scripts/bot_chart.py --out "$RUNNER_TEMP/bot-chart.md"
      - name: Warn if the chart is out of date
        run: |
          for file in bot-chart.md bot-chart-schedule-light.svg bot-chart-schedule-dark.svg; do
            if ! cmp -s "docs/$file" "$RUNNER_TEMP/$file"; then
              echo "::warning file=docs/$file::docs/$file doesn't match bots/. Run python3 scripts/bot_chart.py and commit the result."
            fi
          done
